name: Bug Report
description: Report an issue, canvas glitch, or unexpected behavior in wirecanvas
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue.
        If this is a security vulnerability, please do NOT use this form; refer to [SECURITY.md](https://github.com/itsgoharrehman/wirecanvas/blob/main/SECURITY.md) instead.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Exact steps on the canvas.
      placeholder: |
        1. Place button component
        2. Attempt to resize corner handle
        3. Observe coordinate jump
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should have happened.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment Information
      description: Browser, OS, resolution.
      placeholder: |
        - Browser: Chrome 124 / Firefox 125 / Safari 17
        - OS: Windows 11 / macOS 14 / Linux
    validations:
      required: true